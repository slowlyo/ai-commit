name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v0.1.2, defaults to package.json version)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build & Release VSIX
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Compile extension
        run: npm run compile

      - name: Determine tag name
        id: meta
        env:
          INPUT_TAG: ${{ inputs.tag_name }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            TAG_NAME="$INPUT_TAG"
            if [[ ! "$TAG_NAME" =~ ^v ]]; then
              TAG_NAME="v$TAG_NAME"
            fi
          elif [ "$REF_TYPE" = "tag" ]; then
            TAG_NAME="$REF_NAME"
          else
            TAG_NAME="v$(node -p "require('./package.json').version")"
          fi
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "Resolved release tag: $TAG_NAME"

      - name: Package VSIX
        run: npx @vscode/vsce package --no-dependencies

      - name: Create GitHub Release and Upload VSIX
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag_name }}
          name: ${{ steps.meta.outputs.tag_name }}
          target_commitish: ${{ github.sha }}
          files: "*.vsix"
          generate_release_notes: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to Visual Studio Marketplace (Optional)
        if: env.VS_MARKETPLACE_TOKEN != ''
        env:
          VS_MARKETPLACE_TOKEN: ${{ secrets.VS_MARKETPLACE_TOKEN }}
        run: |
          echo "VS_MARKETPLACE_TOKEN is configured. Publishing extension to Visual Studio Marketplace..."
          npx @vscode/vsce publish --packagePath *.vsix -p "$VS_MARKETPLACE_TOKEN"
